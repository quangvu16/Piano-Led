<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="960" height="610" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1f2328">Wiring — ESP32 + WS2812B strip</text>

  <!-- ESP32 -->
  <rect x="50" y="90" width="270" height="170" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="185" y="120" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">ESP32 dev board</text>
  <text x="185" y="142" font-size="12" fill="#656d76" text-anchor="middle">WROOM-32 · S3 · C3</text>
  <!-- pins -->
  <circle cx="320" cy="165" r="5" fill="#1f2328"/>
  <text x="310" y="169" font-size="13" font-weight="700" fill="#1f2328" text-anchor="end">GPIO 16</text>
  <circle cx="50" cy="245" r="5" fill="#1f2328"/>
  <text x="62" y="249" font-size="13" font-weight="700" fill="#1f2328">GND</text>

  <!-- resistor -->
  <line x1="320" y1="165" x2="440" y2="165" stroke="#1f2328" stroke-width="2"/>
  <rect x="440" y="152" width="80" height="26" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="480" y="170" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">330 Ω</text>
  <line x1="520" y1="165" x2="614" y2="165" stroke="#1f2328" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="153" font-size="11" fill="#656d76" text-anchor="middle">data</text>

  <!-- strip -->
  <rect x="620" y="90" width="290" height="190" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="765" y="120" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">WS2812B strip</text>
  <text x="765" y="142" font-size="12" fill="#656d76" text-anchor="middle">96–144 LEDs/m · 88 keys</text>
  <circle cx="620" cy="165" r="5" fill="#1f2328"/>
  <text x="632" y="169" font-size="13" font-weight="700" fill="#1f2328">DIN</text>
  <circle cx="620" cy="225" r="5" fill="#1f2328"/>
  <text x="632" y="229" font-size="13" font-weight="700" fill="#1f2328">5V</text>
  <circle cx="620" cy="265" r="5" fill="#1f2328"/>
  <text x="632" y="269" font-size="13" font-weight="700" fill="#1f2328">GND</text>
  <!-- mini strip: LEDs over keys -->
  <g>
    <rect x="640" y="185" width="18" height="16" rx="3" fill="#2ea043"/>
    <rect x="664" y="185" width="18" height="16" rx="3" fill="#afb8c1"/>
    <rect x="688" y="185" width="18" height="16" rx="3" fill="#afb8c1"/>
    <rect x="712" y="185" width="18" height="16" rx="3" fill="#afb8c1"/>
    <rect x="736" y="185" width="18" height="16" rx="3" fill="#afb8c1"/>
    <rect x="760" y="185" width="18" height="16" rx="3" fill="#afb8c1"/>
    <rect x="784" y="185" width="18" height="16" rx="3" fill="#afb8c1"/>
    <rect x="808" y="185" width="18" height="16" rx="3" fill="#afb8c1"/>
    <rect x="832" y="185" width="18" height="16" rx="3" fill="#afb8c1"/>
    <rect x="856" y="185" width="18" height="16" rx="3" fill="#afb8c1"/>
  </g>

  <!-- 5V supply -->
  <rect x="50" y="360" width="270" height="120" rx="12" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="185" y="398" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">5 V supply · 3–4 A</text>
  <circle cx="320" cy="410" r="5" fill="#1f2328"/>
  <text x="310" y="414" font-size="13" font-weight="700" fill="#1f2328" text-anchor="end">5 V +</text>
  <circle cx="320" cy="460" r="5" fill="#1f2328"/>
  <text x="310" y="464" font-size="13" font-weight="700" fill="#1f2328" text-anchor="end">GND −</text>

  <!-- 5V rail: PSU+ (320,410) -> right -> x=440 -> up -> strip 5V (620,225) -->
  <polyline points="320,410 440,410 440,225 614,225" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#arr)"/>
  <text x="480" y="216" font-size="11" fill="#656d76">5 V</text>

  <!-- GND rail: PSU- (320,460) -> right -> x=560 -> up -> strip GND (620,265) -->
  <polyline points="320,460 560,460 560,265 614,265" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#arr)"/>
  <text x="575" y="258" font-size="11" fill="#656d76">GND</text>

  <!-- ESP32 GND joins the ground rail -->
  <polyline points="50,245 30,245 30,520 560,520 560,464" fill="none" stroke="#1f2328" stroke-width="2"/>
  <circle cx="560" cy="460" r="5" fill="#1f2328"/>
  <text x="34" y="510" font-size="11" fill="#656d76">all grounds joined</text>

  <!-- capacitor between + and − near the supply -->
  <line x1="400" y1="410" x2="400" y2="428" stroke="#1f2328" stroke-width="2"/>
  <line x1="387" y1="428" x2="413" y2="428" stroke="#1f2328" stroke-width="3"/>
  <line x1="387" y1="436" x2="413" y2="436" stroke="#1f2328" stroke-width="3"/>
  <line x1="400" y1="436" x2="400" y2="460" stroke="#1f2328" stroke-width="2"/>
  <circle cx="400" cy="410" r="5" fill="#1f2328"/>
  <circle cx="400" cy="460" r="5" fill="#1f2328"/>
  <text x="400" y="480" font-size="11.5" fill="#656d76" text-anchor="middle">1000 µF / 16 V</text>

  <!-- notes -->
  <text x="24" y="556" font-size="12.5" fill="#1f2328">•  Data pin: GPIO 16 (WROOM-32 / S3) · GPIO 10 (ESP32-C3) · DIN = the end where the strip's arrow points away</text>
  <text x="24" y="582" font-size="12.5" fill="#1f2328">•  Power the ESP32 by USB, or from the 5 V supply into its 5V/VIN pin · never omit the shared ground</text>
</svg>
